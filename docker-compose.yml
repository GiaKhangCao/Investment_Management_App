version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: investment_db
    environment:
      POSTGRES_DB: investmentdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: